# Date: 06NOV2026
# Author: Minkyu Jung
# Purpose: 검사를 통과한 공개 파일만 Pages에 배포하고 비밀 값이 없으면 안전하게 건너뛴다.
name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  deploy:
    # 소유자가 저장소 변수 CLOUDFLARE_PAGES_PROJECT를 넣기 전(도메인 이전 전)에는 돌지 않는다(docs/MIGRATION.md)
    if: ${{ vars.CLOUDFLARE_PAGES_PROJECT != '' }}
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: node tools/build-site.mjs
      - name: Skip unconfigured deployment
        if: env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == ''
        run: echo '::notice::Pages deployment skipped - configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.'
      - name: Deploy shipped site
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name ${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch main
