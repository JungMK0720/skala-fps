<!DOCTYPE html>
<!--
  Date: 06NOV2026
  Author: Minkyu Jung
  Purpose: 대원 7명 × 두 팀을 한 줄로 세워 이동·앉기·조준·칼·반동·재장전·투척·쓰러짐·이모트를 돌려 보는 개발용 페이지. 히트박스 선과 초상도 같이 본다.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>대원 모델 데모</title>
  <link rel="icon" href="data:,">
  <script type="importmap">{"imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }}</script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1624; color: #e8eef5; font: 13px/1.4 'Malgun Gothic', system-ui, sans-serif; }
    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; }
    #panel { position: fixed; left: 10px; top: 10px; width: 250px; max-height: calc(100% - 20px); overflow: auto; padding: 10px; border-radius: 10px; background: rgba(6, 14, 26, .86); box-shadow: 0 0 0 1px rgba(255, 255, 255, .12); }
    #panel h2 { margin: 8px 0 6px; font-size: 13px; color: #35e0ff; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; border-radius: 5px; padding: 5px 2px; background: rgba(255, 255, 255, .1); }
    button:hover { background: rgba(255, 255, 255, .2); }
    button.on { background: #35e0ff; color: #04202a; font-weight: 700; }
    #stats { margin-top: 8px; white-space: pre; font: 11px/1.45 ui-monospace, Consolas, monospace; color: #b9c8d8; }
    #err { color: #ff8a80; white-space: pre-wrap; word-break: break-all; }
    #names { position: fixed; left: 0; right: 0; bottom: 8px; display: flex; justify-content: center; gap: 0; pointer-events: none; }
    #portraits { position: fixed; right: 10px; top: 10px; display: none; grid-template-columns: repeat(7, 96px); gap: 4px; padding: 8px; border-radius: 10px; background: rgba(6, 14, 26, .86); }
    #portraits img { width: 96px; height: 128px; object-fit: contain; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.12), transparent 70%); border-radius: 6px; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="panel">
    <h2>동작</h2>
    <div class="grid" id="modes"></div>
    <h2>한 번</h2>
    <div class="grid" id="once"></div>
    <h2>이모트</h2>
    <div class="grid" id="emotes"></div>
    <h2>보기</h2>
    <div class="grid" id="views"></div>
    <div id="stats"></div>
    <div id="err"></div>
  </div>
  <div id="portraits"></div>
  <noscript>이 페이지는 JavaScript(ES 모듈)가 필요합니다.</noscript>
  <script type="module">
    import * as THREE from 'three';
    import { createRenderer } from '../js/engine/renderer.js';
    import { loadOperators, OperatorBody, OPERATOR_MODEL_URL } from '../js/engine/operator-model.js';
    import { createAvatarPortraits } from '../js/engine/avatars.js';
    import { OPERATOR_IDS } from '../js/engine/operator-look.js';
    import { AVATARS } from '../js/core/avatar-defs.js';
    import { HITBOX, HITBOX_CROUCH, EMOTES, TEAM_IDS } from '../js/core/consts.js';

    const $ = (id) => document.getElementById(id);
    const showErr = (e) => { $('err').textContent = String((e && e.stack) || e); console.error(e); };
    window.addEventListener('error', (e) => showErr(e.error || e.message));
    const R = createRenderer({ container: $('stage') });
    R.setTheme && R.setTheme({ sky: '#a9cde8', skyTop: '#3f78b5', fog: [60, 240], sunDir: [-0.45, 0.8, -0.35], sunColor: '#fff1d8', ambient: 0.5 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshLambertMaterial({ color: 0x69727d }));
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    R.scene.add(ground);

    const tpl = await loadOperators().catch((e) => { showErr(e); throw e; });
    // 한 줄: 블루 7명, 레드 7명(대원 순서 같음). 모두 카메라(+Z 쪽)를 본다
    const SPACING = 0.95;
    const bodies = [];
    TEAM_IDS.forEach((team, row) => {
      OPERATOR_IDS.forEach((id, i) => {
        const b = new OperatorBody(tpl, id, team);
        b.root.position.set((row * OPERATOR_IDS.length + i - 6.5) * SPACING + (row ? 0.4 : -0.4), 0, 0);
        b.root.rotation.y = Math.PI;
        R.scene.add(b.root);
        bodies.push({ b, id, team });
      });
    });

    // 히트박스 선(F4 디버그와 같은 치수): 머리 구·몸통·다리·발 상자·손 구
    const hitMat = new THREE.MeshBasicMaterial({ color: 0x35ff7a, wireframe: true });
    const hitGroups = [];
    function hitbox(H) {
      const g = new THREE.Group();
      const head = new THREE.Mesh(new THREE.SphereGeometry(H.HEAD.r, 12, 8), hitMat); head.position.y = H.HEAD.y; g.add(head);
      for (const k of ['BODY', 'LEGS', 'FOOT']) {
        const b = H[k];
        const m = new THREE.Mesh(new THREE.BoxGeometry(b.hw * 2, b.y1 - b.y0, b.hd * 2), hitMat);
        m.position.set(0, (b.y0 + b.y1) / 2, b.cz || 0); g.add(m);
      }
      for (const h of H.HANDS) { const s = new THREE.Mesh(new THREE.SphereGeometry(h.r, 10, 8), hitMat); s.position.set(h.x, h.y, h.z); g.add(s); }
      return g;
    }
    for (const { b } of bodies) {
      const stand = hitbox(HITBOX), crouch = hitbox(HITBOX_CROUCH);
      stand.visible = crouch.visible = false;
      b.root.add(stand, crouch);
      hitGroups.push({ stand, crouch });
    }

    const state = { mode: 'idle', emote: 0, pitch: 0, crouch: 0, crouchTarget: 0, hit: false, paused: false, spin: false };
    const MODES = {
      idle: { mx: 0, mz: 0 }, walk: { mx: 0, mz: -1.8 }, run: { mx: 0, mz: -5.2 }, back: { mx: 0, mz: 4 },
      left: { mx: -4.5, mz: 0 }, right: { mx: 4.5, mz: 0 }, diag: { mx: 3.4, mz: -3.4 },
      crouch: { mx: 0, mz: 0, crouch: 1 }, crouchWalk: { mx: 0, mz: -2.4, crouch: 1 }
    };
    const btn = (parent, label, fn, cls) => { const e = document.createElement('button'); e.textContent = label; e.onclick = () => fn(e); if (cls) e.className = cls; parent.append(e); return e; };
    const modeBtns = {};
    const NAMES = { idle: '서기', walk: '걷기', run: '뛰기', back: '뒤로', left: '왼쪽', right: '오른쪽', diag: '대각선', crouch: '앉기', crouchWalk: '앉아 걷기' };
    for (const k of Object.keys(MODES)) modeBtns[k] = btn($('modes'), NAMES[k], () => api.mode(k));
    btn($('once'), '위 조준', () => { state.pitch = 0.7; });
    btn($('once'), '정면', () => { state.pitch = 0; });
    btn($('once'), '아래 조준', () => { state.pitch = -0.6; });
    btn($('once'), '베기', () => all((b) => b.swing('slash')));
    btn($('once'), '찌르기', () => all((b) => b.swing('stab')));
    btn($('once'), '반동', () => all((b) => b.recoil()));
    btn($('once'), '재장전', () => all((b) => b.reload(2)));
    btn($('once'), '투척', () => all((b) => b.throwNade()));
    btn($('once'), '쓰러짐', () => all((b, i) => b.dead ? b.revive() : b.kill([Math.sin(i), Math.cos(i)])));
    btn($('once'), '칼 들기', () => all((b) => b.setHeldKey(b.heldKey === 'gun' ? 'katana' : b.heldKey === 'katana' ? 'knife' : 'gun')));
    btn($('emotes'), '없음', () => api.emote(0));
    for (const e of EMOTES) btn($('emotes'), e.name, () => api.emote(e.code));
    btn($('views'), '히트박스', (e) => { api.hitbox(!state.hit); e.classList.toggle('on', state.hit); });
    btn($('views'), '초상', (e) => { const p = $('portraits'); p.style.display = p.style.display === 'grid' ? 'none' : 'grid'; e.classList.toggle('on', p.style.display === 'grid'); });
    btn($('views'), '멈춤', (e) => { state.paused = !state.paused; e.classList.toggle('on', state.paused); });
    const all = (fn) => bodies.forEach(({ b }, i) => fn(b, i));

    // 초상(상점과 같은 함수)
    const portraits = createAvatarPortraits(R.three);
    await portraits.ready;
    for (const team of TEAM_IDS) for (const id of OPERATOR_IDS) {
      const img = document.createElement('img');
      img.title = id + ' · ' + team;
      img.src = portraits.get(id, team) || '';
      $('portraits').append(img);
    }

    // 통계: 대원별 삼각형 수, 그리기 호출, 모델 파일 크기
    const size = await fetch(OPERATOR_MODEL_URL).then((r) => r.arrayBuffer()).then((b) => b.byteLength).catch(() => 0);
    const tris = OPERATOR_IDS.map((id) => `${id.padEnd(11)} ${tpl.geometry(id, 'owner').userData.triangles}`).join('\n');

    let camA = 0, camD = 9.5, camY = 1.3, camT = [0, 0.95, 0];
    function placeCamera() {
      R.camera.position.set(camT[0] + Math.sin(camA) * camD, camY, camT[2] + Math.cos(camA) * camD);
      R.camera.lookAt(camT[0], camT[1], camT[2]);
    }

    let last = performance.now(), fps = 60, frames = 0, fpsT = 0;
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      frames++; fpsT += dt;
      if (fpsT >= 0.5) { fps = frames / fpsT; frames = 0; fpsT = 0; }
      const m = MODES[state.mode];
      state.crouchTarget = m.crouch || 0;
      state.crouch += Math.sign(state.crouchTarget - state.crouch) * Math.min(Math.abs(state.crouchTarget - state.crouch), dt / 0.12);
      const ck = state.crouch * state.crouch * (3 - 2 * state.crouch);
      if (!state.paused) for (const { b } of bodies) b.update(dt, { moveX: m.mx, moveZ: m.mz, crouch: ck, pitch: state.pitch, emote: state.emote });
      hitGroups.forEach((h) => { h.stand.visible = state.hit && ck < 0.5; h.crouch.visible = state.hit && ck >= 0.5; });
      if (state.spin) camA += dt * 0.3;
      placeCamera();
      R.update(dt);
      R.render();
      const info = R.three.info.render;
      $('stats').textContent = `fps ${fps.toFixed(0)}  calls ${info.calls}  tris ${info.triangles}\nGLB ${(size / 1024).toFixed(0)} KB\n삼각형(대원별)\n${tris}`;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    const api = window.__demo = {
      mode(k) { state.mode = MODES[k] ? k : 'idle'; for (const [n, e] of Object.entries(modeBtns)) e.classList.toggle('on', n === state.mode); },
      emote(code) { state.emote = code | 0; },
      pitch(p) { state.pitch = +p || 0; },
      hitbox(on) { state.hit = !!on; },
      pause(on) { state.paused = !!on; },
      camera(a, d, y, t) { camA = a; camD = d; camY = y; if (t) camT = t; },
      portraits(on) { $('portraits').style.display = on ? 'grid' : 'none'; },
      panel(on) { $('panel').style.display = on ? '' : 'none'; },
      only(id) { bodies.forEach((x) => { x.b.root.visible = !id || x.id === id; }); },
      step(sec, n = 1) { for (let i = 0; i < n; i++) for (const { b } of bodies) { const m = MODES[state.mode]; b.update(sec, { moveX: m.mx, moveZ: m.mz, crouch: state.crouch, pitch: state.pitch, emote: state.emote }); } },
      bodies, tpl, ready: true
    };
    api.mode('idle');
  </script>
</body>
</html>
