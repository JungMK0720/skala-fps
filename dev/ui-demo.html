<!DOCTYPE html>
<!--
  Date: 06NOV2026
  Author: Minkyu Jung
  Purpose: 게임 없이 UI 화면을 띄워 보는 개발용 데모 페이지.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>SKALA FPS — UI 데모 (QA)</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../css/fps.css">
  <style>
    /* 데모 페이지 전용 스타일(QA 패널). 실제 게임 페이지(index.html)에는 필요 없다. */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #06172d; }
    #stage { position: fixed; inset: 0; }
    #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .qa {
      position: fixed; left: 8px; top: 50%; transform: translateY(-50%); z-index: 1000; width: 260px; max-height: 92vh;
      display: flex; flex-direction: column; border-radius: 10px; overflow: hidden;
      font: 12px/1.4 ui-monospace, Consolas, monospace; color: #e9eff7;
      background: rgba(4, 12, 24, .92); box-shadow: 0 0 0 1px rgba(255, 255, 255, .15), 0 10px 30px rgba(0, 0, 0, .5);
    }
    .qa-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; background: #f77f00; color: #1d1000; }
    .qa-body { padding: 8px 10px 10px; overflow-y: auto; }
    .qa.is-min { width: auto; }
    .qa.is-min .qa-body { display: none; }
    .qa button { font: inherit; color: inherit; cursor: pointer; border: 0; border-radius: 5px; padding: 5px 6px; background: rgba(255, 255, 255, .1); }
    .qa button:hover { background: rgba(255, 255, 255, .2); }
    .qa-head button { background: rgba(0, 0, 0, .15); }
    .qa-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .qa-label { margin: 8px 0 4px; font-weight: 700; color: #9db0c6; }
    .qa-help { margin: 8px 0 0; color: #9db0c6; }
    .qa-log { margin: 0; padding: 0 0 0 16px; max-height: 180px; overflow-y: auto; color: #cfe0f2; word-break: break-all; }
    .qa-log li + li { margin-top: 2px; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="scene" aria-hidden="true"></canvas></div>
  <noscript>이 데모는 JavaScript(ES 모듈)가 필요합니다.</noscript>
  <script type="module" src="../js/ui/demo.js"></script>
</body>
</html>
